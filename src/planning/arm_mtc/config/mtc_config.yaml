# MoveIt Task Constructor Configuration for 5-DOF Humanoid Arm

# Task execution parameters
task_execution:
  timeout: 30.0  # seconds
  max_solutions: 10

# Planning parameters
planning:
  planning_group: "arm"
  planner_id: "RRTConnect"
  planning_time: 5.0
  max_velocity_scaling_factor: 0.5
  max_acceleration_scaling_factor: 0.5

# Workspace bounds
workspace:
  min_x: -1.0
  max_x: 1.0
  min_y: -1.0
  max_y: 1.0
  min_z: 0.0
  max_z: 1.5

# Approach/retreat parameters
approach_retreat:
  min_distance: 0.05  # meters
  max_distance: 0.15  # meters
  direction:
    approach_z: -1.0  # downward
    retreat_z: 1.0    # upward
    lift_z: 1.0       # upward

# Frame IDs
frames:
  world_frame: "world"
  base_frame: "base_link"
  end_effector_frame: "wrist_roll_link"
  planning_frame: "world"

# Object parameters (for pick/place tasks)
objects:
  default_object:
    dimensions: [0.05, 0.05, 0.1]  # [x, y, z] in meters
    type: "box"

  pick_location:
    x: 0.3
    y: 0.0
    z: 0.2

  place_location:
    x: 0.3
    y: 0.3
    z: 0.2

# Predefined poses (must match SRDF)
poses:
  home: "home"
  # Add more predefined poses as needed
