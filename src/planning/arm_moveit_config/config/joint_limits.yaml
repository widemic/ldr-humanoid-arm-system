# joint_limits.yaml allows the dynamics properties specified in the URDF to be overwritten or augmented as needed

# For beginners, we downscale velocity and acceleration limits.
# You can always specify higher scaling factors (<= 1.0) in your motion requests.
# Set to 1.0 for maximum speed, or lower values (0.1-0.5) for safer/slower motion
default_velocity_scaling_factor: 1.0  # 100% - Full speed
default_acceleration_scaling_factor: 1.0  # 100% - Full acceleration

# Specific joint properties can be changed with the keys [max_position, min_position, max_velocity, max_acceleration]
# Joint limits can be turned off with [has_velocity_limits, has_acceleration_limits]
#
# Values below are RATED limits from actuator_specs.yaml (continuous operation safe)
# Acceleration limits calculated from: α = (τ_rated / I_total) × safety_factor
#   where I_total = I_motor_reflected + I_all_downstream_links
#   Accounts for all mass each joint must accelerate in the kinematic chain
joint_limits:
  left_shoulder_pitch_rs04:
    has_velocity_limits: true
    max_velocity: 17.49  # rad/s (ROBSTRIDE 04 rated_speed)
    has_acceleration_limits: true
    max_acceleration: 9.0  # rad/s² (moves entire arm: highest load)
  left_shoulder_roll_rs04:
    has_velocity_limits: true
    max_velocity: 17.49  # rad/s (ROBSTRIDE 04 rated_speed)
    has_acceleration_limits: true
    max_acceleration: 9.0  # rad/s² (moves arm minus shoulder pitch link)
  left_shoulder_yaw_rs03:
    has_velocity_limits: true
    max_velocity: 18.85  # rad/s (ROBSTRIDE 03 rated_speed)
    has_acceleration_limits: true
    max_acceleration: 15.0  # rad/s² (moves forearm + hand + gripper)
  left_elbow_rs03:
    has_velocity_limits: true
    max_velocity: 18.85  # rad/s (ROBSTRIDE 03 rated_speed)
    has_acceleration_limits: true
    max_acceleration: 19.0  # rad/s² (moves forearm + hand + gripper)
  left_wrist_rs02:
    has_velocity_limits: true
    max_velocity: 37.70  # rad/s (ROBSTRIDE 02 rated_speed)
    has_acceleration_limits: true
    max_acceleration: 24.0  # rad/s² (moves hand + gripper only)
  left_hand_rs02:
    has_velocity_limits: true
    max_velocity: 37.70  # rad/s (ROBSTRIDE 02 rated_speed)
    has_acceleration_limits: true
    max_acceleration: 32.0  # rad/s² (moves gripper only: lowest load)
  left_palm_left_finger:
    has_velocity_limits: true
    max_velocity: 0.05  # m/s (gripper linear motion)
    has_acceleration_limits: true
    max_acceleration: 0.1  # m/s²
  left_palm_right_finger:
    has_velocity_limits: true
    max_velocity: 0.05  # m/s (gripper linear motion)
    has_acceleration_limits: true
    max_acceleration: 0.1  # m/s²