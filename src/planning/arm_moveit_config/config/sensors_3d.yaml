sensors:
  - depth_camera

depth_camera:
  # Use the depth point cloud so MoveIt builds an OctoMap matching the octomap_server input
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: /camera/depth/points

  # Map quality / performance tuning (match octomap_server defaults)
  max_range: 5.0
  point_subsample: 1
  padding_offset: 0.03
  padding_scale: 4.0
  max_update_rate: 1.0

  # Plumbing
  filtered_cloud_topic: filtered_cloud
  queue_size: 5
