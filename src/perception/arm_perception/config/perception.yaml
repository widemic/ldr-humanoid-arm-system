perception_node:
  ros__parameters:
    # Camera topic
    camera_topic: "/camera/depth/points"

    # Target frame for all detections
    target_frame: "base_fixture_link"

    # Plane segmentation (RANSAC)
    plane_distance_threshold: 0.01  # 1cm tolerance for plane fitting

    # Clustering parameters (DBSCAN)
    cluster_tolerance: 0.02         # 2cm - points within this distance are same cluster
    min_cluster_size: 50            # Minimum points to be considered an object
    max_cluster_size: 5000          # Maximum points per object

    # Shape detection parameters
    cylinder_radius_min: 0.01       # 1cm minimum radius
    cylinder_radius_max: 0.15       # 15cm maximum radius
    min_object_height: 0.02         # 2cm minimum object height

    # Processing rate
    processing_rate: 1.0            # Process point cloud at 1 Hz
    point_downsample_factor: 4      # Downsample by taking every 4th point (speeds up by ~16x)

    # Z-axis filtering (relative to target_frame)
    z_min: -0.5                     # Filter out points below this Z
    z_max: 1.5                      # Filter out points above this Z
