controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: position_controllers/JointTrajectoryController
      joints:
        - joint1
        - joint2
        - joint3
        - joint4
        - joint5
      gains:
        joint1: {p: 100.0, d: 1.0}
        joint2: {p: 100.0, d: 1.0}
        joint3: {p: 100.0, d: 1.0}
        joint4: {p: 50.0, d: 1.0}
        joint5: {p: 50.0, d: 1.0}
