controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
      publish_rate: 50

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    hand_controller:
      type: position_controllers/GripperActionController

arm_controller:
  ros__parameters:
    joints:
      - left_shoulder_pitch_rs04
      - left_shoulder_roll_rs04
      - left_shoulder_yaw_rs03
      - left_elbow_rs03
      - left_wrist_rs02
      - left_hand_rs02
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

hand_controller:
  ros__parameters:
    joint: left_palm_right_finger

    # Action monitoring
    action_monitor_rate: 20.0

    # Goal tolerances
    goal_time: 0.0
    goal_tolerance: 0.001

    # Stall detection
    stall_velocity_threshold: 0.001
    stall_timeout: 0.5

    # Maximum effort
    max_effort: 10.0

    # Allow stalling
    allow_stalling: true
