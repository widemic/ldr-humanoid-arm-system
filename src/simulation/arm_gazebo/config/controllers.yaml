controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
      publish_rate: 50
      
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - left_shoulder_pitch_rs04
      - left_shoulder_roll_rs04
      - left_shoulder_yaw_rs03
      - left_elbow_rs03
      - left_wrist_rs02
      - left_hand_rs02
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
