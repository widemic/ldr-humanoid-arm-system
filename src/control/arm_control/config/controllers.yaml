# Custom Arm Controller - PID position control
arm_controller:
  ros__parameters:
    joints:
      - left_shoulder_pitch_rs04
      - left_shoulder_roll_rs04
      - left_shoulder_yaw_rs03
      - left_elbow_rs03
      - left_wrist_rs02
      - left_hand_rs02

    # PID gains per joint (Kp, Ki, Kd)
    # TUNING STATUS: After fixing command interface conflict
    # Format: [shoulder_pitch, shoulder_roll, shoulder_yaw, elbow, wrist, hand]
    pid:
      kp: [750.0, 450.0, 0.0, 0.0, 60.0, 20.0]   # Reduced for stability
      ki: [15.0, 15.0, 0.0, 0.0, 1.5, 0.9]         # Disable until stable
      kd: [32.0, 25.0, 0.0, 0.0, 0.1, 0.05] # Increased damping to reduce oscillation

    # Effort limits per joint (Nm)
    # These are RATED (continuous) torque limits from actuator_specs.yaml
    # URDF defines max (peak) torque, controller enforces rated (continuous) torque
    # Format: [shoulder_pitch, shoulder_roll, shoulder_yaw, elbow, wrist, hand]
    effort_limits:
      rated: [40.0, 40.0, 20.0, 20.0, 6.0, 6.0]   # Continuous operation limits
      max: [120.0, 120.0, 60.0, 60.0, 17.0, 17.0]  # Peak torque (allowed for brief periods)
      peak_duration: 2.0  # Max duration for peak torque (seconds) before thermal limiting kicks in

    # Velocity limits per joint (rad/s)
    # URDF defines max (no-load) speed, controller enforces rated (continuous) speed
    # Format: [shoulder_pitch, shoulder_roll, shoulder_yaw, elbow, wrist, hand]
    velocity_limits:
      rated: [17.49, 17.49, 18.85, 18.85, 37.70, 37.70]  # Continuous operation speed
      max: [20.94, 20.94, 20.42, 20.42, 42.94, 42.94]    # Peak (no-load) speed (from URDF, for reference)

    # Torque-Speed Curves per motor type (from datasheet)
    # Format: [speed_rpm, torque_nm, speed_rpm, torque_nm, ...]
    # Interpolated at runtime to determine max available torque at current speed
    torque_speed_curves:
      # RS04: 120 Nm @ low speed, declining to 0 Nm at 200 rpm
      rs04: [0.0, 120.0, 105.0, 120.0, 167.0, 40.0, 200.0, 0.0]
      # RS03: 60 Nm @ 160 rpm → 20 Nm @ 180 rpm → 0 Nm @ 195 rpm
      rs03: [160.0, 60.0, 180.0, 20.0, 195.0, 0.0]
      # RS02: 12 Nm @ 115 rpm → 6 Nm @ 360 rpm → 0 Nm @ 410 rpm
      rs02: [115.0, 12.0, 360.0, 6.0, 410.0, 0.0]

    # Thermal Curves per motor type (from datasheet)
    # Format: [torque_nm, duration_seconds, torque_nm, duration_seconds, ...]
    # -1 duration means continuous operation (at or below rated torque)
    # Interpolated at runtime to determine max duration at current torque level
    thermal_curves:
      # RS04: Continuous at 40 Nm, decreasing duration for higher torques
      rs04: [40.0, -1.0, 46.0, 2500.0, 50.0, 1600.0, 60.0, 700.0, 70.0, 350.0, 80.0, 160.0, 90.0, 90.0, 100.0, 40.0, 110.0, 20.0, 120.0, 10.0]
      # RS03: 30 Nm → 190s, 40 Nm → 126s, 50 Nm → 12s, 60 Nm → 6s
      rs03: [20.0, -1.0, 30.0, 190.0, 40.0, 126.0, 50.0, 12.0, 60.0, 6.0]
      # RS02: Detailed thermal curve from 6.5 Nm to 17 Nm
      rs02: [6.0, -1.0, 6.5, 3000.0, 7.0, 1300.0, 9.0, 370.0, 11.0, 100.0, 13.0, 35.0, 15.0, 18.0, 17.0, 10.0]


# Hand Controller - controls gripper fingers via joint trajectory
# Note: Only controls left_palm_right_finger; left_palm_left_finger mimics automatically
hand_controller:
  ros__parameters:
    joints:
      - left_palm_right_finger

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity
      - effort

    # Simple tolerances
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0  # No goal time constraint

    # Allow external trajectory commands
    allow_partial_joints_goal: false
    allow_integration_in_goal_trajectories: true
