controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    # Controller list
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
      publish_rate: 50.0
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController


# # Joint State Broadcaster - publishes /joint_states
# joint_state_broadcaster:
#   ros__parameters:
#     publish_rate: 50.0


# Arm Trajectory Controller - main interface for motion control
arm_controller:
  ros__parameters:
    joints:
      - left_shoulder_pitch_rs04
      - left_shoulder_roll_rs04
      - left_shoulder_yaw_rs03
      - left_elbow_rs03
      - left_wrist_rs02
      - left_hand_rs02

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    # Simple tolerances
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0  # No goal time constraint

    # Allow external trajectory commands
    allow_partial_joints_goal: false
    allow_integration_in_goal_trajectories: true


# Hand Controller - controls both fingers independently
hand_controller:
  ros__parameters:
    joints:
      - left_palm_right_finger
      - left_palm_left_finger

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    # Goal tolerances
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 2.0

    allow_nonzero_velocity_at_trajectory_end: true
