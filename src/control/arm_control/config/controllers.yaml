controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    # Controller list
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
      publish_rate: 50.0
    arm_controller:
      type: arm_control/ArmController
    hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController


